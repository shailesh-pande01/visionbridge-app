kotlin.code.style=official

# ── VisionBridge backend (the existing MERN server in the web project) ──
# LAN address of the machine running `node server.js`, used when the app runs
# on a physical device that is on the same Wi-Fi network. Find it with
# `ipconfig` (Windows) or `ifconfig` (macOS/Linux).
# Not needed for the emulator (10.0.2.2) or for USB + `adb reverse tcp:5000 tcp:5000`.
visionbridge.lanHost=10.245.222.201
visionbridge.apiPort=5000
org.gradle.configuration-cache=true
visionbridge.prodUrl=https://visionbridge-backend-3h58.onrender.com